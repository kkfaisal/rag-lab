# Thread-aware chunking + BM25/vector hybrid (RRF) + cross-encoder reranker.
# Shares load/embed settings with baseline where possible so the cache is reused.
name: hybrid_rerank
description: Slack thread-aware chunks, BM25+vector RRF over 50 candidates, MiniLM cross-encoder keeps top 10.

data:
  subset: dev

load:
  impl: corpus

chunk:
  impl: slack_aware
  chunk_size: 1200
  overlap: 150

embed:
  impl: sentence_transformers
  model: BAAI/bge-small-en-v1.5

index:
  impl: duckdb
  fts: true
  vectors: true

retrieve:
  impl: hybrid
  top_k: 50
  candidates: 100

rerank:
  impl: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 10

generate:
  impl: llm
  provider: anthropic
  model: claude-sonnet-5-5
  context_chunks: 10

evaluate:
  impl: benchmark
  judge: auto
