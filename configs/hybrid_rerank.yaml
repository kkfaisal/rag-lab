# Thread-aware chunking + BM25/vector hybrid (RRF) + cross-encoder reranker.
# Only Slack chunks differ from baseline; every other chunk text is identical, so its embedding is reused from the store.
name: hybrid_rerank
description: Slack thread-aware chunks, BM25+vector RRF over 50 candidates, MiniLM cross-encoder keeps top 10.

data:
  dataset: enterprise_rag_bench
  subset: dev          # 100 questions (10 per category) + gold docs + 20k distractors
  snapshot: latest

load:
  impl: corpus

chunk:
  impl: slack_aware
  chunk_size: 1200
  overlap: 150

embed:
  impl: sentence_transformers
  model: BAAI/bge-small-en-v1.5

index:
  impl: duckdb
  fts: true
  vectors: true

retrieve:
  impl: hybrid
  top_k: 50
  candidates: 100

rerank:
  impl: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 10

generate:
  impl: llm
  provider: anthropic
  model: claude-sonnet-5-5
  context_chunks: 10

evaluate:
  impl: standard
  judge: auto
