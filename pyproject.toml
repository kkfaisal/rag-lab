[project]
name = "rag-lab"
version = "0.1.0"
description = "Iterate on RAG pipelines against EnterpriseRAG-Bench, with every experiment versioned and browsable."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=1.0",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "opensearch-py>=3.2.0",
    "pyarrow>=17",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
rag-lab = "rag_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rag_lab"]

[dependency-groups]
dev = ["pytest>=8"]
